name: Release
on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    FORCE_COLOR: true
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
    contents: write

jobs:
    Build:
        name: Build SnoreClient
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Setup PNPM
              uses: pnpm/setup@v2.1.0
              with:
                  runtime: node@v24
                  require-lockfile: true

            - name: Build web
              run: pnpm buildWebStandalone
              env:
                  SNORECLIENT_SERVER_URL: ${{ vars.SNORECLIENT_SERVER_URL }}

            - name: Build
              run: pnpm buildStandalone
              env:
                  SNORECLIENT_SERVER_URL: ${{ vars.SNORECLIENT_SERVER_URL }}

            - name: Generate plugin lists
              run: |
                  pnpm generatePluginJson dist/plugins.json
                  pnpm generateSnoreClientPluginJson dist/snoreclientplugins.json
                  pnpm generateVencordPluginJson dist/vencordplugins.json
                  pnpm generateDevsList dist/devs.json

            - name: Collect files to be released
              run: |
                  cd dist
                  mkdir release

                  cp browser/browser.* release
                  cp SnoreClient.user.{js,js.LEGAL.txt} release

                  # copy the plugin data jsons, the extension zips and the desktop/equibop asars
                  cp *.{json,zip,asar} release

                  # legacy un-asared files
                  cp desktop/* release
                  for file in equibop/*; do
                    filename=$(basename "$file")
                    cp "$file" "release/equibop${filename^}"
                  done

                  find release -size 0 -delete
                  rm release/package.json
                  rm release/*.map

            - name: Add installer scripts to the release
              run: |
                  cp misc/install.sh dist/release/install.sh
                  cp misc/install.ps1 dist/release/install.ps1

            - name: Create the "latest" release if it does not exist
              run: |
                  gh release view latest >/dev/null 2>&1 || gh release create latest \
                    --title "SnoreClient latest" \
                    --notes "Rolling release. Every push to main replaces these files. Install with the scripts in the README." \
                    --latest

            - name: Upload SnoreClient Stable
              run: |
                  gh release edit latest --title "SnoreClient ${GITHUB_SHA}" --latest
                  gh release upload latest --clobber dist/release/*
