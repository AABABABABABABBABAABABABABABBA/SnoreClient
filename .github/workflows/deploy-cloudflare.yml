name: Deploy Cloudflare Worker
on:
    push:
        branches:
            - main
        paths:
            - "server/**"
            - ".github/workflows/deploy-cloudflare.yml"
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy to Cloudflare
        runs-on: ubuntu-latest
        if: ${{ vars.CLOUDFLARE_DEPLOY != 'false' }}
        steps:
            - name: Check for Cloudflare credentials
              id: creds
              env:
                  TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
                  EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
                  ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  if [ -z "$ACCOUNT" ] || { [ -z "$TOKEN" ] && { [ -z "$KEY" ] || [ -z "$EMAIL" ]; }; }; then
                    echo "::warning::Skipping deploy. Add repository secrets: CLOUDFLARE_ACCOUNT_ID plus either CLOUDFLARE_API_TOKEN, or CLOUDFLARE_API_KEY (Global API Key) and CLOUDFLARE_EMAIL."
                    echo "ok=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "ok=true" >> "$GITHUB_OUTPUT"
                  fi

            - uses: actions/checkout@v7
              if: steps.creds.outputs.ok == 'true'

            - uses: actions/setup-node@v4
              if: steps.creds.outputs.ok == 'true'
              with:
                  node-version: 22

            - name: Test worker
              if: steps.creds.outputs.ok == 'true'
              working-directory: server/cloudflare
              run: node --test test/*.test.js

            - name: Resolve the D1 database id
              if: steps.creds.outputs.ok == 'true'
              working-directory: server/cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npm install --no-audit --no-fund
                  ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="snoreclient");if(!db){console.error("No D1 database named snoreclient. Run: npx wrangler d1 create snoreclient");process.exit(1)}console.log(db.uuid)})')
                  sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
                  grep database_id wrangler.toml

            - name: Apply D1 schema and deploy
              if: steps.creds.outputs.ok == 'true'
              working-directory: server/cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npx wrangler d1 execute snoreclient --remote --file=schema.sql
                  npx wrangler deploy

            - name: Sync the Discord client secret to the worker
              if: steps.creds.outputs.ok == 'true' && env.DISCORD_CLIENT_SECRET != ''
              working-directory: server/cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
                  CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
              run: printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
