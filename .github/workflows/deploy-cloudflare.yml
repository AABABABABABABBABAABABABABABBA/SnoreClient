name: Deploy Cloudflare Worker
on:
    push:
        branches:
            - main
        paths:
            - "server/**"
            - ".github/workflows/deploy-cloudflare.yml"
    workflow_dispatch:

jobs:
    deploy:
        name: Deploy to Cloudflare
        runs-on: ubuntu-latest
        if: ${{ vars.CLOUDFLARE_DEPLOY != 'false' }}
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Test worker
              working-directory: server/cloudflare
              run: node --test test/*.test.js

            - name: Resolve the D1 database id
              working-directory: server/cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npm install --no-audit --no-fund
                  ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(d=>d.name==="snoreclient");if(!db){console.error("No D1 database named snoreclient. Run: npx wrangler d1 create snoreclient");process.exit(1)}console.log(db.uuid)})')
                  sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/$ID/" wrangler.toml
                  grep database_id wrangler.toml

            - name: Apply D1 schema
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: server/cloudflare
                  command: d1 execute snoreclient --remote --file=schema.sql

            - name: Deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: server/cloudflare
                  command: deploy
